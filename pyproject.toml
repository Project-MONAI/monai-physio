[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physiotwin4d"
version = "2026.08.0"
description = "Methods, workflows, tutorials, and CLI for creating personalized physiological digital twins from 3D/4D medical images"
authors = [
    {name = "Stephen R. Aylward", email = "saylward@nvidia.com"}
]
maintainers = [
    {name = "Stephen R. Aylward", email = "saylward@nvidia.com"}
]
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "Apache-2.0"}
# 3.11 is the floor because the [physicsnemo] extra needs nvidia-physicsnemo,
# which supports >=3.11,<3.14. Declaring 3.10 made that extra unresolvable
# there while claiming otherwise.
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
keywords = [
    "medical-imaging",
    "4d-ct",
    "cardiac-imaging",
    "lung-imaging",
    "omniverse",
    "usd",
    "monai",
    "segmentation",
    "registration",
    "deformable-registration",
    "image-registration",
    "model-registration",
    "visualization",
    "ai",
    "deep-learning",
    "totalsegmentator",
    "ICON",
    "ANTS",
    "physiological-motion",
    "4d-visualization",
    "digital-twin",
    "statistical-shape-model",
    "physicsnemo",
    "meshgraphnet"
]
dependencies = [
    # Core medical imaging
    "itk>=5.3.0,<6.0.0",
    "nibabel>=4.0.0",
    "numpy>=1.21.0",
    "pydicom>=2.4.0",
    "pynrrd>=1.0.0",
    "vtk>=9.2.0",

    # AI/ML and segmentation
    # monai>=1.4 is required for monai.networks.nets.vista3d132 and
    # monai.apps.vista3d, used by the NV-Segment-CTMR bundle.
    "monai>=1.4.0",
    "torch>=2.0.0",
    "transformers>=4.21.0",
    "totalsegmentator>=2.0.0",
    "huggingface_hub>=0.24.0",
    "einops>=0.6.1",

    # Registration
    # 0.6.1 is the first release with a CPython 3.13 Windows wheel. Below it the
    # solver is free to pick 0.5.3, whose newest Windows wheel is 3.12, and on
    # 3.13 that means building ANTs and ITK from source -- which fails.
    "antspyx>=0.6.1",
    "icon-registration>=1.0.0",
    "picsl-greedy>=0.0.12",
    "scipy>=1.10.0",
    # Finetuning (``unigradicon.finetuning``, used by
    # WorkflowFinetuneICONRegistration and Tutorial 2) only exists on the
    # uniGradICON ``feat-add-finetuning`` branch; see [tool.uv.sources] below.
    "unigradicon>=1.0.0",

    # Visualization and USD
    "pyvista[all]>=0.47.0",
    "usd-core>=23.11",
    "trimesh>=4.0.0",
    "pyacvd>=0.4.0",

    # Utilities
    "ipykernel>=6.0.0",
    "matplotlib>=3.5.0",
    "typing-extensions>=4.0.0",

]

[tool.uv]
link-mode = "copy"
# torch-scatter compiles against torch but does not declare it as a build
# dependency. Its build environment must therefore be the project environment,
# so torch (and setuptools) must already be installed before installing the
# physicsnemo extra.
no-build-isolation-package = ["torch-scatter"]
# antspyx builds ANTs and ITK from source, which takes a long time and needs a
# toolchain the runners do not all have. Refusing the sdist turns a silent
# fallback to a doomed source build into an immediate resolution error naming
# the interpreter that has no wheel.
no-build-package = ["antspyx"]

# PyTorch packages default to the CUDA 13.0 wheel index for uv-managed
# environments. This avoids ambiguous resolution across multiple PyTorch CUDA
# indexes.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
# The PyPI unigradicon release ships no ``unigradicon.finetuning`` module, so
# finetuning (WorkflowFinetuneICONRegistration, Tutorial 2) needs this branch.
# Declared as a uv source instead of a PEP 508 direct reference in
# [project.dependencies] because PyPI rejects direct references at upload time.
# pip users must install the branch explicitly:
#   pip install "unigradicon @ git+https://github.com/uncbiag/uniGradICON.git@feat-add-finetuning"
unigradicon = { git = "https://github.com/uncbiag/uniGradICON.git", branch = "feat-add-finetuning" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.optional-dependencies]
cuda13 = [
    "cupy-cuda13x>=13.6.0",
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
]
# PhysicsNeMo pulls in a large dependency stack (CUDA-only toolchain, narrower
# Python support). It is needed for the PhysicsNeMo train/infer workflows and
# Tutorial 9 (mesh stage MLP / MeshGraphNet). ``torch-geometric`` supplies the
# graph batching / connectivity utilities used by the MeshGraphNet (MGN) path,
# and ``torch-scatter`` provides its scatter/segment reduction backend. Note:
# nvidia-physicsnemo itself requires Python >= 3.11. When no matching pre-built
# torch-scatter wheel exists it is compiled from source against the installed
# torch, so torch and setuptools must be present first:
#
#   pip install "physiotwin4d[cuda13]" setuptools
#   pip install "physiotwin4d[physicsnemo]" --no-build-isolation
#
# uv applies --no-build-isolation to torch-scatter automatically via
# no-build-isolation-package above, so the second flag is only needed for pip.
physicsnemo = [
    "nvidia-physicsnemo>=2.0.0",
    "torch-geometric>=2.5.0",
    "torch-scatter>=2.1.0",
]
dev = [
    "bumpver>=2023.0.0",
    "jupytext>=1.16.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # See the [test] extra: conftest.py needs a pluggy new enough for
    # pytest.hookimpl(wrapper=True), which pytest>=7.0 alone does not pin.
    "pluggy>=1.2.0",
    "mypy>=2.1.0",
    "ruff>=0.1.0",
    "scipy-stubs>=1.14.0.0,<1.16.0.0",
    "types-requests>=2.32.0.0",
]
docs = [
    # Sphinx core and theme
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",

    # Sphinx extensions
    "sphinx-autodoc-typehints>=3.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-tabs>=3.4.7",
    "myst-parser>=4.0.0",

    # Docutils 0.22 removed some node attributes (e.g. "backrefs") that
    # sphinx-tabs expects, causing a KeyError during builds.
    "docutils<0.22",

    # Additional dependencies
    "linkify-it-py>=2.0.0",
    "uc-micro-py>=1.0.1",
    "markdown-it-py>=3.0.0",

    # Bundled ffmpeg binary used by utils/mp4_to_gif.py
    "imageio-ffmpeg>=0.5.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    # conftest.py's pytest_runtest_makereport uses pytest.hookimpl(wrapper=True),
    # a new-style hook wrapper that pluggy only grew in 1.2.0. pytest>=7.0 alone
    # permits an older pluggy, where that keyword raises at collection time.
    "pluggy>=1.2.0",
    "pytest-timeout>=2.0.0",
    "coverage[toml]>=7.0.0",
]
# Every optional component at once. Inherits the physicsnemo caveats above:
# torch and setuptools must already be installed, and pip needs
# ``--no-build-isolation`` when torch-scatter has no matching wheel.
all = [
    "physiotwin4d[cuda13]",
    "physiotwin4d[dev]",
    "physiotwin4d[docs]",
    "physiotwin4d[physicsnemo]",
    "physiotwin4d[test]",
]

[project.urls]
Homepage = "https://github.com/Project-MONAI/physiotwin4d"
Documentation = "https://project-monai.github.io/physiotwin4d/"
Repository = "https://github.com/Project-MONAI/physiotwin4d.git"
"Bug Tracker" = "https://github.com/Project-MONAI/physiotwin4d/issues"
"Author LinkedIn" = "https://www.linkedin.com/in/stephenaylward"
"Author Google Scholar" = "https://scholar.google.com/citations?user=u1UdL4oAAAAJ&hl"

[project.scripts]
# CLI commands installed via pip
# Entry points reference the main() functions in the cli submodule
physiotwin4d-convert-image-to-vtk = "physiotwin4d.cli.convert_image_to_vtk:main"
physiotwin4d-convert-image-4d-to-3d = "physiotwin4d.cli.convert_image_4d_to_3d:main"
physiotwin4d-convert-image-to-usd = "physiotwin4d.cli.convert_image_to_usd:main"
physiotwin4d-convert-vtk-to-usd = "physiotwin4d.cli.convert_vtk_to_usd:main"
physiotwin4d-create-statistical-model = "physiotwin4d.cli.create_statistical_model:main"
physiotwin4d-download-data = "physiotwin4d.cli.download_data:main"
physiotwin4d-fit-statistical-model-to-patient = "physiotwin4d.cli.fit_statistical_model_to_patient:main"
physiotwin4d-train-physicsnemo = "physiotwin4d.cli.train_physicsnemo:main"
physiotwin4d-infer-physicsnemo = "physiotwin4d.cli.infer_physicsnemo:main"
physiotwin4d-reconstruct-highres-4d-ct = "physiotwin4d.cli.reconstruct_highres_4d_ct:main"
physiotwin4d-visualize-pca-modes = "physiotwin4d.cli.visualize_pca_modes:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.bumpver]
current_version = "2026.08.0"
version_pattern = "YYYY.0M.PATCH[PYTAGNUM]"
commit_message = "Bump version {old_version} -> {new_version}"
commit = false
tag_message = "{new_version}"
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/physiotwin4d/__init__.py" = [
    '__version__ = "{version}"',
]

[tool.mypy]
python_version = "3.11"
# The tutorials' parameter modules are plain sibling modules rather than a
# package, so tests that import them need this on the search path, the same
# way pythonpath does it for pytest.
mypy_path = "tutorials"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# Third-party libraries used by runtime modules may be untyped or unavailable in
# lean type-checking environments. Keep that suppression scoped to those imports
# instead of applying it to first-party modules.
[[tool.mypy.overrides]]
module = [
    "ants",
    "ants.*",
    "cupy",
    "cupy_backends",
    "cupy_backends.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "imageio_ffmpeg",
    "icon_registration",
    "icon_registration.*",
    "itk",
    "itk.*",
    "matplotlib",
    "matplotlib.*",
    "nibabel",
    "nibabel.*",
    "nrrd",
    "numpy",
    "numpy.*",
    "picsl_greedy",
    "pydicom",
    "pydicom.*",
    "physicsnemo",
    "physicsnemo.*",
    "pxr",
    "pxr.*",
    "pyacvd",
    "pyacvd.*",
    "pyvista",
    "pyvista.*",
    "simpleware",
    "simpleware.*",
    "SimpleITK",
    "SimpleITK.*",
    "sklearn.*",
    "torch",
    "torch.*",
    "torch_geometric",
    "torch_geometric.*",
    "totalsegmentator.*",
    "trimesh",
    "trimesh.*",
    "unigradicon",
    "unigradicon.*",
    "vista3d_config",
    "vista3d_model",
    "vista3d_pipeline",
    "vtk",
    "vtk.*",
    "yaml",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "physiotwin4d.cli.create_statistical_model",
    "physiotwin4d.cli.fit_statistical_model_to_patient",
    "physiotwin4d.cli.visualize_pca_modes",
    "physiotwin4d.vtk_to_usd.mesh_utils",
    "physiotwin4d.vtk_to_usd.vtk_reader",
    # Tutorial scripts import physiotwin4d, which is absent from the isolated
    # pre-commit mypy environment and ships no py.typed marker when installed.
    # mypy per-module patterns match whole components only, so each tutorial is
    # listed by name; add a line here when adding or renaming a tutorial.
    "parameters_base",
    "parameters_duke_heart_labelmaps",
    "parameters_heart_ct_kcl",
    "parameters_lung_ct_dirlab",
    "tutorial_01_heart_gated_ct_to_usd",
    "tutorial_01_lung_gated_ct_to_usd",
    "tutorial_02_duke_heart_distancemap_finetune_icon",
    "tutorial_02_lung_distancemap_finetune_icon",
    "tutorial_02_lung_finetune_icon",
    "tutorial_03_heart_reconstruct_highres_4d_ct",
    "tutorial_03_lung_reconstruct_highres_4d_ct",
    "tutorial_04_duke_heart_labelmap_to_vtk",
    "tutorial_04_heart_ct_to_vtk",
    "tutorial_04_lung_ct_to_vtk",
    "tutorial_05_duke_heart_vtk_to_usd",
    "tutorial_05_heart_vtk_to_usd",
    "tutorial_06_duke_heart_create_statistical_model",
    "tutorial_06_heart_create_statistical_model",
    "tutorial_06_lung_create_statistical_model",
    "tutorial_07_duke_heart_fit_statistical_model_to_patient",
    "tutorial_07_heart_fit_statistical_model_to_patient",
    "tutorial_07_lung_fit_statistical_model_to_patient",
    "tutorial_08_duke_heart_fit_model_to_4d_patients",
    "tutorial_08_lung_fit_model_to_4d_patients",
    "tutorial_09_duke_heart_train_physicsnemo_mgn",
    "tutorial_09_lung_train_physicsnemo_mgn",
    "tutorial_10_duke_heart_infer_physicsnemo_mgn",
    "tutorial_10_lung_infer_physicsnemo_mgn",
    "tutorial_11_duke_heart_evaluate_physicsnemo",
    "tutorial_11_lung_evaluate_physicsnemo",
    "tutorial_12_duke_heart_end_to_end_inference",
    "tutorial_12_lung_end_to_end_inference",
    "tutorial_13_heart_and_lung_motion",
    "tutorial_14_duke_heart_shape_parameter_sweep",
    "tutorial_14_lung_shape_parameter_sweep",
    "tutorial_15_duke_heart_leave_one_out",
    "tutorial_15_lung_leave_one_out",
]
disable_error_code = ["import-not-found", "import-untyped"]

[[tool.mypy.overrides]]
# torch/icon_registration/unigradicon are lazy-loaded at runtime; string
# forward-reference annotations like "torch.Size" are intentional.
module = ["physiotwin4d.register_images_icon"]
ignore_errors = true

[tool.pyright]
# Third-party packages (e.g. pyvista) are in dependencies but may have no stubs;
# do not report import-not-found so analysis matches mypy overrides above.
reportMissingImports = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=physiotwin4d",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
testpaths = ["tests"]
pythonpath = [".", "tutorials"]
# Surface every warning by default ("always"), then silence the third-party
# ITK/SWIG binding noise emitted while wrapped C++ types are defined at import
# on CPython >=3.12 ("builtin type Swig... has no __module__ attribute").
# Those come from the bindings, not our code, and would otherwise drown the
# warnings summary. Order matters: the trailing "ignore" entries are applied
# last and so take precedence over "always" for these specific messages.
filterwarnings = [
    "always",
    "ignore:builtin type Swig",
    "ignore:builtin type swigvarlink",
]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, multiple components)",
    "slow: marks tests as slow (skipped by default; opt-in via --run-slow)",
    "requires_gpu: marks tests that require GPU/CUDA support (opt-in via --run-gpu)",
    "requires_simpleware: marks tests that require a local Synopsys Simpleware Medical installation (opt-in via --run-simpleware)",
    "requires_physicsnemo: marks tests that require the optional [physicsnemo] extra (opt-in via --run-physicsnemo)",
    "tutorial: marks tests that run tutorial scripts (data/GPU gated, manual only)",
    "xdist_group: marks tests to run in the same pytest-xdist worker (prevents parallel conflicts)"
]
timeout = 1200

[tool.coverage.run]
source = ["src/physiotwin4d"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/experiments/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
    ".mypy_cache",
    ".pytest_cache"
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C90",   # mccabe complexity
    "T10",   # flake8-debugger
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "PL",    # pylint rules
]
ignore = [
    "B008",    # do not perform function calls in argument defaults
    "C901",    # too complex
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "S101",    # use of assert (needed for pytest)
    "COM812",  # trailing comma (conflicts with formatter)
    "ISC001",  # implicit string concatenation (conflicts with formatter)
    "UP007",   # use Optional[] instead of | for union with None (itk.Image compatibility)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"test_*.py" = ["S101", "PLR2004", "ARG001", "ARG002"]
"tests/*.py" = ["S101", "PLR2004", "ARG001", "ARG002"]
"experiments/**/*.py" = ["T201", "S101"]
# torch/icon_registration are lazy-loaded at runtime; forward-reference strings are intentional
"src/physiotwin4d/register_images_icon.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["physiotwin4d"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88
