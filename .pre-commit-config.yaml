# Pre-commit configuration for MONAI Physio
# Simplified to use Ruff for all linting and formatting

repos:
  # Ruff - fast linter and formatter (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Run the linter with auto-fixes
      - id: ruff-check
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Local hooks run from the active project venv
  - repo: local
    hooks:
      # Type checking with mypy. Runs in the project venv rather than an
      # isolated hook env: the GPU modules are typed against the installed
      # torch, warp and pyvista, which an isolated env would lack.
      # Pass only the staged files pre-commit selects (via the files regex);
      # do not scan whole src/ and tutorials/ trees, which would include
      # untracked files.
      - id: mypy
        name: mypy
        entry: mypy
        # pre-commit checks files in batches, so per-module config sections for
        # files outside a batch would be reported as unused.
        args: [--config-file=pyproject.toml, --no-warn-unused-configs]
        language: system
        types: [python]
        files: ^(src/|tutorials/)

      # Local tests (optional - can be disabled if too slow)
      - id: fast-unit-tests
        name: Run Fast Unit Tests
        entry: pytest tests/ -m "not slow" -v --maxfail=3
        language: system
        pass_filenames: false
        always_run: false
        files: ^(src/monai_physio/|tests/)
        stages: [pre-push]
